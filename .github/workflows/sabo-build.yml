name: Sabo APK build

# Baut bei jedem Push auf einen sabo-Branch eine APK und stellt sie als
# Release "sabo-latest" bereit (fester Download-Link fürs Handy).
on:
  push:
    branches:
      - "sabo-*"
  workflow_dispatch:

concurrency:
  group: sabo-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Immer derselbe Schlüssel, damit neue Builds als Update über die alte
      # Version installiert werden können. Der Keystore liegt passwortgeschützt
      # im Repo, das Passwort nur im Secret SABO_KEY_PASSWORD.
      - name: Signing key
        env:
          SABO_KEY_PASSWORD: ${{ secrets.SABO_KEY_PASSWORD }}
        run: |
          if [ -z "$SABO_KEY_PASSWORD" ]; then
            echo "::error::Secret SABO_KEY_PASSWORD fehlt (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          cat > android/key.properties <<PROPS
          storePassword=$SABO_KEY_PASSWORD
          keyPassword=$SABO_KEY_PASSWORD
          keyAlias=sabo
          storeFile=sabo-signing.jks
          PROPS

      # Debug-Builds behalten sonst den Start-Eintrag der MainActivity UND
      # das Icon-Alias -> zwei App-Icons. Wie im Release-Build entfernen.
      - name: Single launcher icon
        run: |
          cat > android/app/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application>
                  <activity android:name=".MainActivity">
                      <intent-filter tools:node="remove">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      # Gleiche Einstellungen wie der offizielle Nightly-Build: eigene App-ID
      # (.nightly), läuft also neben der normalen Zangetsu-App.
      - name: Build APK
        env:
          ZANGETSU_NO_DISCORD: "1"
          ZANGETSU_NIGHTLY: "1"
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk zangetsu-sabo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sabo-latest
          name: Zangetsu (Sabo) – neuester Build
          prerelease: true
          make_latest: false
          body: |
            Build von Branch ${{ github.ref_name }} (Commit ${{ github.sha }}).
            Neu: Ungelesen-Zähler auf den Covern + Sortierung "Unread".
          files: zangetsu-sabo.apk
